{% extends "base.html" %}
{% block title %}Messages - Instagram Clone{% endblock %}
{% block content %}
<section class="card"><h1>Messages</h1><p>Choose someone to start a private conversation.</p><ul>{% for user in users %}<li><a href="{{ url_for('conversation', user_id=user.id) }}">{{ user.username }}</a></li>{% else %}<li>No other users yet.</li>{% endfor %}</ul></section>
<style>h1 { margin-top:0; } ul { margin:16px 0 0; padding:0; list-style:none; } li { padding:12px 0; border-top:1px solid #eee; }</style>
{% endblock %}
