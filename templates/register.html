<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #262626;
        }

        .register-box {
            width: min(100% - 32px, 360px);
            padding: 32px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fff;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 14px;
            padding: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 14px;
        }

        .message {
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fff1f1;
            color: #b00020;
        }

        .success {
            background: #edf8f0;
            color: #18703a;
        }

        button {
            width: 100%;
            padding: 10px 14px;
            border: 0;
            border-radius: 4px;
            background: #0095f6;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1877f2;
        }
    </style>
</head>
<body>
    <main class="register-box">
        <h1>Create account</h1>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
