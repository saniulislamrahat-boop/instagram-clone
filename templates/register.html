{% extends "base.html" %}
{% block title %}Register - Instagram Clone{% endblock %}
{% block content %}
    <section class="auth card">
        <h1>Create account</h1>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Register</button>
        </form>
        <p class="signup-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </section>
    <style>.auth { width: min(100%, 420px); margin: 12vh auto; } .auth h1, .signup-link { text-align: center; } .auth h1 { margin-top: 0; } .signup-link { margin-bottom: 0; }</style>
{% endblock %}
